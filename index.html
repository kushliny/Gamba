<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine - Real Spin</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .slot-machine {
            background: linear-gradient(180deg, #444, #222);
            padding: 30px;
            border: 8px solid #ffd700;
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,215,0,0.2);
            text-align: center;
        }

        /* Kontejner pro válce */
        .reels-container {
            display: flex;
            gap: 15px;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            border: 4px solid #555;
            margin: 20px 0;
            overflow: hidden; /* Důležité: skryje zbytek pásu */
        }

        /* Okno jednoho válce */
        .reel-window {
            width: 80px;
            height: 80px; /* Výška jednoho symbolu */
            background: white;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }

        /* Pás se symboly uvnitř okna */
        .symbol-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: top 2s cubic-bezier(0.45, 0.05, 0.55, 0.95); /* Hladký dojezd */
        }

        .symbol {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: #333;
            box-sizing: border-box;
            border-bottom: 1px solid #ddd;
        }

        .stats { margin-bottom: 20px; }
        .balance-text { font-size: 1.5rem; color: #00ff88; }
        .win-text { color: #ffd700; min-height: 1.5em; font-size: 1.2rem; margin-top: 5px;}

        input {
            padding: 10px;
            width: 70px;
            font-size: 1.1rem;
            border-radius: 5px;
            border: none;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.4rem;
            cursor: pointer;
            background: #e6b800;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 5px 0 #997a00;
            margin-top: 10px;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #997a00;
        }

        button:disabled { background: #666; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="slot-machine">
        <h1 style="margin-top: 0; color: #ffd700;">ROYAL SLOT</h1>
        
        <div class="stats">
            <div class="balance-text">Kredit: <span id="balance">1000</span> Kč</div>
            <div id="win-display" class="win-text"></div>
        </div>

        <div class="reels-container">
            <div class="reel-window"><div id="strip1" class="symbol-strip"></div></div>
            <div class="reel-window"><div id="strip2" class="symbol-strip"></div></div>
            <div class="reel-window"><div id="strip3" class="symbol-strip"></div></div>
        </div>

        <div>
            Sázka: <input type="number" id="bet-input" value="10" min="1">
        </div>

        <button id="spin-btn" onclick="spin()">ZATOČIT</button>
        <p id="message">Nastav sázku a hraj!</p>
    </div>

    <script>
        const symbols = ['7', '💎', '🍋', '🍒', '🔔', 'BAR'];
        const symbolHeight = 80; // musí odpovídat CSS
        let balance = 1000;
        let isSpinning = false;

        // Vytvoření dlouhých pásů symbolů pro efekt točení
        function createStrip(elementId) {
            const strip = document.getElementById(elementId);
            let html = '';
            // Přidáme 30 náhodných symbolů pro efekt dlouhého točení
            for (let i = 0; i < 40; i++) {
                const symbol = symbols[Math.floor(Math.random() * symbols.length)];
                html += `<div class="symbol">${symbol}</div>`;
            }
            strip.innerHTML = html;
        }

        // Inicializace
        createStrip('strip1');
        createStrip('strip2');
        createStrip('strip3');

        function spin() {
            if (isSpinning) return;

            const bet = parseInt(document.getElementById('bet-input').value);
            const msg = document.getElementById('message');
            const winDisplay = document.getElementById('win-display');
            
            if (bet > balance || bet <= 0) {
                msg.textContent = "Neplatná sázka nebo málo peněz!";
                return;
            }

            isSpinning = true;
            balance -= bet;
            document.getElementById('balance').textContent = balance;
            document.getElementById('spin-btn').disabled = true;
            winDisplay.textContent = "";
            msg.textContent = "Točíme...";

            const results = [];

            for (let i = 1; i <= 3; i++) {
                const strip = document.getElementById(`strip${i}`);
                const randomIndex = Math.floor(Math.random() * (symbols.length));
                const finalSymbol = symbols[randomIndex];
                results.push(finalSymbol);

                // Resetování pásu na začátek bez animace (aby mohl znovu padat dolů)
                strip.style.transition = 'none';
                strip.style.top = '0px';
                
                // Malý hack pro prohlížeč, aby si všiml resetu pozice
                strip.offsetHeight; 

                // Spuštění animace po mírném zpoždění
                const stopAt = 30 + randomIndex; // zastavíme na symbolu hluboko v poli (index 30+)
                const offset = -(stopAt * symbolHeight);
                
                // Nastavení animace s různým časem pro každý válec
                strip.style.transition = `top ${1.5 + (i * 0.5)}s cubic-bezier(0.45, 0.05, 0.55, 0.95)`;
                strip.style.top = offset + 'px';

                // Přepíšeme symbol na cílové pozici, aby odpovídal našemu výsledku
                strip.children[stopAt].textContent = finalSymbol;
            }

            // Vyhodnocení po skončení poslední animace (cca 3s)
            setTimeout(() => {
                evaluate(results, bet);
                isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
            }, 3000);
        }

        function evaluate(results, bet) {
            const [r1, r2, r3] = results;
            let win = 0;
            const msg = document.getElementById('message');

            if (r1 === r2 && r2 === r3) {
                win = (r1 === '7') ? bet * 50 : bet * 10;
                msg.textContent = "VÝBORNĚ! Trojice!";
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                win = bet * 2;
                msg.textContent = "Dvojice! Máš výhru.";
            } else {
                msg.textContent = "Zkus to znovu.";
            }

            if (win > 0) {
                balance += win;
                document.getElementById('balance').textContent = balance;
                document.getElementById('win-display').textContent = `VYHRÁL JSI: ${win} Kč`;
            }
        }
    </script>
</body>
</html>
